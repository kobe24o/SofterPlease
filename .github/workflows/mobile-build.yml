name: mobile-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/softerplease-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed APK
        env:
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$UPDATE_MANIFEST_PUBLIC_KEY_BASE64"
          flutter build apk --release --dart-define=UPDATE_PUBLIC_KEY_BASE64="$UPDATE_MANIFEST_PUBLIC_KEY_BASE64"

      - name: Verify APK identity
        run: |
          APK_PATH="$(pwd)/build/app/outputs/flutter-apk/app-release.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Locate APK
        id: apk
        run: |
          APK_PATH="$(pwd)/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: softerplease-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Create signed update manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$UPDATE_MANIFEST_PRIVATE_KEY_BASE64"
          APK_PATH="${{ steps.apk.outputs.path }}"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_PATH" | awk -F ': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')
          test ${#CERT_SHA256} -eq 64
          BUILD_NUMBER=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)
          test -n "$BUILD_NUMBER"
          dart run tool/create_signed_update_manifest.dart \
            --apk "$APK_PATH" \
            --version "${GITHUB_REF_NAME#v}" \
            --build-number "$BUILD_NUMBER" \
            --certificate-sha256 "$CERT_SHA256" \
            --output "$RUNNER_TEMP/latest.json"

      - name: Publish signed update feed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd "$GITHUB_WORKSPACE"
          if git ls-remote --exit-code --heads origin update-feed; then
            git fetch origin update-feed
            git switch --force --create update-feed FETCH_HEAD
          else
            git switch --orphan update-feed
          fi
          mkdir -p updates
          cp "$RUNNER_TEMP/latest.json" updates/latest.json
          git add updates/latest.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publish signed update ${GITHUB_REF_NAME}"
          git push origin HEAD:update-feed
