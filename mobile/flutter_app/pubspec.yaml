name: softerplease
version: 2.3.0+15
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0
  shared_preferences: ^2.2.2
  record: ^7.0.0
  path_provider: ^2.1.1
  path: ^1.8.3
  audioplayers: ^6.1.0
  flutter_secure_storage: ^9.2.4
  flutter_markdown_plus: ^1.0.7
  cryptography: ^2.9.0
  package_info_plus: ^9.0.1
  sherpa_onnx: 1.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/softerplease-logo.png
    - assets/models/sensevoice/model.int8.onnx
    - assets/models/sensevoice/tokens.txt
    - assets/models/vad/ten-vad.int8.onnx
    - assets/models/speaker/model.onnx

flutter_launcher_icons:
  android: true
  image_path: assets/branding/softerplease-logo.png
  adaptive_icon_background: "#F6F7F4"
  adaptive_icon_foreground: assets/branding/softerplease-logo.png
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 24
